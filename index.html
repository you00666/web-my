<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的专业导航 V2.0</title><style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#718096;--line:#e6eaf0;--blue:#2563eb;--shadow:0 12px 35px #18243a12}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif;color:var(--text);background:var(--bg)}body.dark{--bg:#0f172a;--card:#172033;--text:#eef2ff;--muted:#9aa7bd;--line:#2a3549;--shadow:0 12px 35px #0005}body.bg{background-size:cover;background-position:center;background-attachment:fixed}body.bg:before{content:"";position:fixed;inset:0;background:#0002;z-index:-1}.wrap{width:min(1200px,94%);margin:auto;padding:26px 0 50px}header{text-align:center;padding:20px}.logo{font-size:38px;font-weight:800}.sub{color:var(--muted);margin-top:6px}.toolbar,.search{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:15px auto}.btn,.search select,.search input,.field input,.field select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 13px}.btn{cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:white}.search{max-width:900px}.search input{flex:1;min-width:240px;padding:14px}.search select{padding:0 10px}.info{text-align:center;color:var(--muted);font-size:13px;margin:15px}.cats{display:flex;gap:8px;overflow:auto;padding:8px 0 16px;justify-content:center}.cat.active{background:var(--blue);color:#fff}.section{margin:22px 0}.section h2{font-size:19px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px}.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);transition:.18s;cursor:grab}.card:hover{transform:translateY(-3px)}.card.drag{opacity:.4}.top{display:flex;gap:12px;align-items:center}.icon{width:48px;height:48px;border-radius:13px;background:#2563eb14;display:grid;place-items:center;font-size:25px;overflow:hidden;flex:none}.icon img{width:100%;height:100%;object-fit:cover}.card h3{margin:0 0 5px;font-size:16px}.card p{margin:0;color:var(--muted);font-size:12px}.card a{color:inherit;text-decoration:none}.actions{display:flex;gap:6px;margin-top:14px}.actions button{font-size:12px;padding:6px 9px}.star{position:absolute;right:9px;top:8px;border:0;background:none;font-size:19px;cursor:pointer}.modal-bg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-bg.show{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:20px;padding:24px;border:1px solid var(--line)}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field select{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.empty{text-align:center;color:var(--muted);padding:35px}.danger{color:#dc2626}.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat div{padding:12px;border:1px solid var(--line);border-radius:12px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}@media(max-width:650px){.two,.stat{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><div class="logo">🌐 我的专业导航</div><div class="sub">V2.0 · 外贸 · AI · 设计 · 工具 · 开发 · 学习</div><div class="toolbar"><button class="btn primary" onclick="addSite()">＋ 添加网站</button><button class="btn" onclick="manage()">⚙ 管理中心</button><button class="btn" onclick="toggleDark()">🌙 深色</button></div></header><div class="search"><select id="engine"><option value="https://www.google.com/search?q=">Google</option><option value="https://www.bing.com/search?q=">Bing</option><option value="https://www.baidu.com/s?wd=">百度</option><option value="https://duckduckgo.com/?q=">DuckDuckGo</option></select><input id="q" placeholder="搜索网站或输入关键词，按 Enter…"></div><div class="info"><span id="clock"></span>　|　<span id="weather">天气获取中…</span>　|　<span id="count"></span></div><div id="cats" class="cats"></div><main id="main"></main><footer class="info">数据保存在浏览器本地 · GitHub Pages 可直接部署</footer></div>
<div id="siteModal" class="modal-bg"><div class="modal"><h2 id="siteTitle">添加网站</h2><div class="field"><label>网站名称</label><input id="name"></div><div class="field"><label>网址</label><input id="url" placeholder="https://example.com"></div><div class="two"><div class="field"><label>分类</label><select id="cat"></select></div><div class="field"><label>图标</label><input id="icon" placeholder="Emoji 或图片 URL；留空自动获取"></div></div><div class="field"><label>简介</label><input id="desc"></div><div class="modal-actions"><button class="btn" onclick="closeM()">取消</button><button class="btn primary" onclick="saveSite()">保存</button></div></div></div>
<div id="manageModal" class="modal-bg"><div class="modal"><h2>⚙ 管理中心</h2><div class="stat"><div><b id="s1">0</b><span>网站</span></div><div><b id="s2">0</b><span>分类</span></div><div><b id="s3">0</b><span>收藏</span></div><div><b id="s4">0</b><span>自定义</span></div></div><div class="field"><label>新增分类</label><input id="newCat" placeholder="例如：供应商 / 常用工具"><button class="btn primary" style="margin-top:7px" onclick="newCat()">＋ 添加分类</button></div><div class="field"><label>网站数据备份</label><button class="btn" onclick="backup()">⬇ 导出 JSON</button> <button class="btn" onclick="document.getElementById('restore').click()">⬆ 导入 JSON</button><input id="restore" type="file" accept="application/json" hidden onchange="restore(event)"></div><div class="field"><label>背景图片 URL</label><input id="bg" placeholder="https://...jpg"><button class="btn primary" style="margin-top:7px" onclick="saveBg()">保存背景</button> <button class="btn" onclick="clearBg()">清除</button></div><div class="field"><label>本地背景图</label><input id="bgfile" type="file" accept="image/*"></div><div class="modal-actions"><button class="btn danger" onclick="resetAll()">恢复默认数据</button><button class="btn" onclick="closeManage()">关闭</button></div></div></div>
<script>
const defaults=[['Google','https://www.google.com','常用网站','🔎','全球搜索'],['Bing','https://www.bing.com','常用网站','🟦','微软搜索'],['YouTube','https://www.youtube.com','常用网站','▶️','在线视频'],['Gmail','https://mail.google.com','常用网站','✉️','邮件'],['ChatGPT','https://chatgpt.com','AI 工具','🤖','AI 助手'],['Claude','https://claude.ai','AI 工具','🧠','AI 助手'],['Gemini','https://gemini.google.com','AI 工具','✨','Google AI'],['Canva','https://www.canva.com','设计资源','🎨','在线设计'],['Alibaba','https://www.alibaba.com','外贸获客','🛒','B2B 外贸平台'],['Made-in-China','https://www.made-in-china.com','外贸获客','🌏','中国制造网'],['LinkedIn','https://www.linkedin.com','外贸获客','💼','商务社交'],['Google Maps','https://maps.google.com','外贸获客','📍','客户与公司查询'],['Pexels','https://www.pexels.com','设计资源','📷','免费图片'],['Unsplash','https://unsplash.com','设计资源','🖼️','高质量图片'],['Behance','https://www.behance.net','设计资源','🎨','设计作品'],['Adobe','https://www.adobe.com','设计资源','🔴','Adobe 创意工具'],['Smallpdf','https://smallpdf.com','在线工具','📄','PDF 工具'],['Notion','https://www.notion.so','在线工具','📝','笔记管理'],['TinyPNG','https://tinypng.com','在线工具','🖼️','图片压缩'],['GitHub','https://github.com','软件与开发','🐙','代码托管'],['Vercel','https://vercel.com','软件与开发','▲','网站部署'],['Cloudflare','https://www.cloudflare.com','软件与开发','☁️','DNS/CDN'],['Python','https://www.python.org','软件与开发','🐍','Python 官网'],['Wikipedia','https://www.wikipedia.org','学习与资讯','📚','百科'],['Google News','https://news.google.com','学习与资讯','📰','新闻资讯'],['Coursera','https://www.coursera.org','学习与资讯','🎓','在线课程'],['TED','https://www.ted.com','学习与资讯','🎤','演讲与学习']];
const defaultCats=['常用网站','AI 工具','外贸获客','设计资源','在线工具','软件与开发','学习与资讯'];
let sites=JSON.parse(localStorage.navV2Sites||'null')||defaults.map(x=>({name:x[0],url:x[1],category:x[2],icon:x[3],desc:x[4],custom:false}));let cats=JSON.parse(localStorage.navV2Cats||'null')||[...defaultCats];let fav=JSON.parse(localStorage.navV2Fav||'[]');let active='全部',edit=-1;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.navV2Sites=JSON.stringify(sites);localStorage.navV2Cats=JSON.stringify(cats);localStorage.navV2Fav=JSON.stringify(fav)}
function render(){let cs=['全部','收藏',...cats.filter(x=>x!=='全部'&&x!=='收藏')];$('cats').innerHTML=cs.map(c=>`<button class="btn cat ${c===active?'active':''}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join('');let groups={};sites.forEach((s,i)=>{if(active==='收藏'&&!fav.includes(i))return;if(active!=='全部'&&active!=='收藏'&&s.category!==active)return;(groups[s.category]??=[]).push([s,i])});$('main').innerHTML='';Object.entries(groups).forEach(([cat,arr])=>{let sec=document.createElement('section');sec.className='section';sec.innerHTML=`<h2>${esc(cat)} <span class="info">${arr.length}</span></h2><div class="grid"></div>`;let grid=sec.querySelector('.grid');arr.forEach(([s,i])=>grid.appendChild(card(s,i)));$('main').appendChild(sec)});if(!$('main').children.length)$('main').innerHTML='<div class="empty">暂无网站</div>';$('count').textContent=`网站：${sites.length}`;save()}
function card(s,i){let d=document.createElement('div');d.className='card';d.draggable=true;d.dataset.i=i;let ic=s.icon||autoIcon(s.url);let visual=/^https?:\/\//i.test(ic)?`<img src="${esc(ic)}" onerror="this.parentElement.innerHTML='🌐'">`:esc(ic);d.innerHTML=`<button class="star">${fav.includes(i)?'★':'☆'}</button><a href="${safe(s.url)}" target="_blank" rel="noopener"><div class="top"><div class="icon">${visual}</div><div><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p></div></div></a><div class="actions"><button onclick="editSite(${i})">编辑</button><button onclick="del(${i})">删除</button></div>`;d.querySelector('.star').onclick=e=>{e.stopPropagation();fav.includes(i)?fav.splice(fav.indexOf(i),1):fav.push(i);render()};d.addEventListener('dragstart',()=>d.classList.add('drag'));d.addEventListener('dragend',()=>d.classList.remove('drag'));d.addEventListener('dragover',e=>e.preventDefault());d.addEventListener('drop',e=>{e.preventDefault();let from=+document.querySelector('.drag').dataset.i;if(from===i)return;let x=sites.splice(from,1)[0];sites.splice(i,0,x);fav=fav.map(n=>n===from?i:n===i?from:n);render()});return d}
function safe(u){try{let x=new URL(u);return /^https?:$/.test(x.protocol)?esc(x.href):'#'}catch{return '#'}}function autoIcon(u){try{return 'https://www.google.com/s2/favicons?sz=128&domain='+new URL(u).hostname}catch{return '🌐'}}function setCat(x){active=x;render()}
function fill(){ $('cat').innerHTML=cats.map(x=>`<option>${esc(x)}</option>`).join('') }
function addSite(){edit=-1;$('siteTitle').textContent='添加网站';['name','url','icon','desc'].forEach(x=>$(x).value='');fill();show('siteModal')}
function editSite(i){edit=i;let s=sites[i];$('siteTitle').textContent='编辑网站';fill();$('name').value=s.name;$('url').value=s.url;$('cat').value=s.category;$('icon').value=s.icon||'';$('desc').value=s.desc||'';show('siteModal')}
function saveSite(){let n=$('name').value.trim(),u=$('url').value.trim();if(!n||!u)return alert('请填写名称和网址');if(!/^https?:\/\//i.test(u))u='https://'+u;let s={name:n,url:u,category:$('cat').value,icon:$('icon').value.trim()||autoIcon(u),desc:$('desc').value.trim(),custom:true};edit<0?sites.push(s):sites[edit]=s;closeM();render()}
function del(i){if(confirm('确定删除 '+sites[i].name+' 吗？')){sites.splice(i,1);fav=fav.filter(x=>x!==i).map(x=>x>i?x-1:x);render()}}function show(id){$(id).classList.add('show')}function closeM(){$('siteModal').classList.remove('show')}function manage(){$('s1').textContent=sites.length;$('s2').textContent=cats.length;$('s3').textContent=fav.length;$('s4').textContent=sites.filter(x=>x.custom).length;$('bg').value=localStorage.navV2Bg||'';show('manageModal')}function closeManage(){$('manageModal').classList.remove('show')}
function newCat(){let x=$('newCat').value.trim();if(x&&!cats.includes(x)){cats.push(x);$('newCat').value='';save();render();alert('分类已添加')}}function backup(){let blob=new Blob([JSON.stringify({version:'2.0',sites,cats,fav},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='我的导航_V2.0_备份.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.sites)||!Array.isArray(d.cats))throw 0;sites=d.sites;cats=d.cats;fav=Array.isArray(d.fav)?d.fav:[];save();render();alert('恢复成功')}catch{alert('备份文件格式不正确')}};r.readAsText(f)}
function saveBg(){let x=$('bg').value.trim();if(x){localStorage.navV2Bg=x;applyBg(x)}else clearBg()}function clearBg(){localStorage.removeItem('navV2Bg');localStorage.removeItem('navV2BgData');document.body.style.backgroundImage='';document.body.classList.remove('bg')}function applyBg(x){document.body.style.backgroundImage=`url("${x.replaceAll('"','%22')}")`;document.body.classList.add('bg')}
$('bgfile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>3e6)return alert('建议背景图片不超过 3MB');let r=new FileReader();r.onload=()=>{localStorage.navV2BgData=r.result;localStorage.removeItem('navV2Bg');applyBg(r.result)};r.readAsDataURL(f)};
function resetAll(){if(!confirm('确定恢复默认网站和分类？自定义内容会丢失。'))return;sites=defaults.map(x=>({name:x[0],url:x[1],category:x[2],icon:x[3],desc:x[4],custom:false}));cats=[...defaultCats];fav=[];save();render();closeManage()}
function toggleDark(){document.body.classList.toggle('dark');localStorage.navV2Dark=document.body.classList.contains('dark')?'1':'0'}$('q').onkeydown=e=>{if(e.key==='Enter'){let q=e.target.value.trim();if(q)open(($('engine').value)+encodeURIComponent(q),'_blank')}};$('engine').value=localStorage.navV2Engine||'https://www.google.com/search?q=';$('engine').onchange=e=>localStorage.navV2Engine=e.target.value;
function clock(){$('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false})}setInterval(clock,1000);clock();if(localStorage.navV2Dark==='1')document.body.classList.add('dark');let b=localStorage.navV2BgData||localStorage.navV2Bg;if(b)applyBg(b);render();
if(navigator.geolocation){navigator.geolocation.getCurrentPosition(async p=>{try{let d=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=temperature_2m&timezone=auto`).then(r=>r.json());$('weather').textContent=`天气：${d.current.temperature_2m}°C`}catch{$('weather').textContent='天气：获取失败'}},()=>{$('weather').textContent='天气：未授权'})}else $('weather').textContent='天气：不可用';
</script></body></html>
